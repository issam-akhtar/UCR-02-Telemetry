<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 702.765625 450" style="max-width: 702.766px; background-color: transparent;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#my-svg .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,149.668,108.74L0,0Z" fill="#ECECFF" class="pieCircle"/><path d="M149.668,108.74A185,185,0,0,1,-57.168,175.945L0,0Z" fill="#ffffde" class="pieCircle"/><path d="M-57.168,175.945A185,185,0,0,1,-175.945,57.168L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"/><path d="M-175.945,57.168A185,185,0,0,1,-167.393,-78.769L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"/><path d="M-167.393,-78.769A185,185,0,0,1,-89.124,-162.117L0,0Z" fill="hsl(60, 100%, 63.5294117647%)" class="pieCircle"/><path d="M-89.124,-162.117A185,185,0,0,1,-34.666,-181.723L0,0Z" fill="hsl(80, 100%, 76.2745098039%)" class="pieCircle"/><path d="M-34.666,-181.723A185,185,0,0,1,0,-185L0,0Z" fill="hsl(300, 100%, 76.2745098039%)" class="pieCircle"/><text transform="translate(123.62715523113604,-62.99118183886211)" class="slice" style="text-anchor: middle;">35%</text><text transform="translate(42.87610796952396,131.95909163595255)" class="slice" style="text-anchor: middle;">20%</text><text transform="translate(-98.11106588963347,98.11106588963348)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-138.47620856942268,-8.712184584692166)" class="slice" style="text-anchor: middle;">12%</text><text transform="translate(-101.14439705472086,-94.98091094760557)" class="slice" style="text-anchor: middle;">10%</text><text transform="translate(-46.999886434034174,-130.5472066923988)" class="slice" style="text-anchor: middle;">5%</text><text transform="translate(-13.057528472943812,-138.13422258867735)" class="slice" style="text-anchor: middle;">3%</text><text x="0" y="-200" class="pieTitleText">Message Type Distribution (Typical Race Session)</text><g class="legend" transform="translate(216,-77)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"/><text x="22" y="14">Cell Voltage Data (50-57)</text></g><g class="legend" transform="translate(216,-55)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"/><text x="22" y="14">Motor Controller